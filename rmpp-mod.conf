# rmpp-mod.conf: how the rmpp installer lists and installs this mod.
# Format: https://github.com/lorancecall/rmpp-packages/blob/main/MODS.md
id=rmpp-textobj
type=vellum
package=rmpp-textobj
default=0
needs=rmpp-preload rmpp-lang
check=test -e /usr/lib/rmpp/preload.d/55-rmpp-textobj.so
short_ko=텍스트 객체 (실험적)
short_en=Text objects (beta)
detail_ko=T 메뉴의 Add text object: 펜 획으로 그린 글자를 옮기고 지우고 두 번 탭해 고칩니다.|라쏘는 객체를 통째로 고릅니다. 글꼴은 rmpp-lang 언어 애드온에서 옵니다.
detail_en=T menu > Add text object: text drawn as pen strokes you can move, erase and double tap to edit.|The lasso takes whole objects. Glyphs come from rmpp-lang's language add-ons.
